[package]
name = "consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
candle-core = { git = "https://github.com/huggingface/candle.git", version = "0.9.2-alpha.1", features = ["cuda"] }
hound = "3.5.1"
tempfile = "3.8"
whisper-rs = "0.15.1"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros", "signal"] }
uuid = { version = "1.18.1", features = ["v4"] }
amqprs = { version = "2.1.3" }
async-trait = "0.1.89"
aws-sdk-s3 = { version = "1.115.0", features = ["rt-tokio"] }
aws-config = "1.8.11"
anyhow = "1.0"
backtrace = "0.3"
serde_json = "1.0.145"
