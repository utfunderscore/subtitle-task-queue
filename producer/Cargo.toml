[package]
name = "producer"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros"] }
aws-sdk-s3 = { version = "1.115.0", features = ["rt-tokio"] }
aws-config = "1.8.11"
uuid = { version = "1.18.1", features = ["v4"] }
amqprs = { version = "2.1.3" }
axum = { version = "0.8.7", features = ["multipart", "tokio", "macros"] }
tower-http = { version = "0.6.1", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
db = {path = "../db"}
common = {path = "../common"}
