[package]
name = "consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
hound = "3.5.1"
tempfile = "3.8"
whisper-rs = { version = "0.15.1", features = ["cuda"] }
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "macros", "signal"] }
amqprs = { version = "2.1.3" }
async-trait = "0.1.89"
aws-sdk-s3 = { version = "1.115.0", features = ["rt-tokio"] }
aws-config = "1.8.11"
anyhow = "1.0"
common = { path = "../common" }
db = { path = "../db" }
